# Synced into k8s by the mirage pipeline (cuneiform-policies/sync.sh).
#
# `db_password` is generated; the role and database on atlas are made, and the role's
# password kept equal to it, by job.yml (pothos-db-ensure), which reads it as
# POTHOS_DB_PASSWORD. trellis migrates at start (rel/overlays/bin/server) and isn't ready
# until the database exists.
path: galaxy-kv/prod/pothos
secret: pothos-env-secrets
generate:
  secret_key_base: base64-48
  # Basic auth in front of the whole site while the game is in development.
  # Read it back with `bao kv get -field=gate_password galaxy-kv/prod/pothos`
  # (the user is TRELLIS_GATE_USER in the configmap).
  gate_password: alnum-24
  # The tester login's (TRELLIS_TESTER_USER): `bao kv get -field=tester_password
  # galaxy-kv/prod/pothos`.
  tester_password: alnum-16
  db_password: alnum-32
env:
  SECRET_KEY_BASE: "{secret_key_base}"
  TRELLIS_GATE_PASSWORD: "{gate_password}"
  TRELLIS_TESTER_PASSWORD: "{tester_password}"
  # The pothos database on atlas: runs, keepers, the rest.
  DATABASE_URL: "ecto://pothos:{db_password}@atlas-service.galaxy.svc.cluster.local:5432/pothos"
  # The same password alone, for job.yml to set on the role.
  POTHOS_DB_PASSWORD: "{db_password}"
