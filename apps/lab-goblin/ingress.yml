# Not applied by mirage's CI (it applies no ingresses): `lab new` applies it.
# *.lab.pinwheel.fan already points at galaxy; cert-manager gets the certificate.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: goblin-ingress
  namespace: lab
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: lab-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: goblin.lab.pinwheel.fan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: goblin-service
                port:
                  number: 80
  tls:
    - secretName: goblin-tls
      hosts:
        - goblin.lab.pinwheel.fan
