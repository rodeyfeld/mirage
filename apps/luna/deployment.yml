apiVersion: apps/v1
kind: Deployment
metadata:
  name: luna
  namespace: galaxy
spec:
  replicas: 1
  selector:
    matchLabels:
      name: luna
  template:
    metadata:
      labels:
        name: luna
    spec:
      serviceAccountName: luna
      containers:
        - name: luna
          image: schematics.pinwheel.fan/rodeyfeld/luna
          imagePullPolicy: Always 
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          envFrom:
            - configMapRef:
                name: luna-config
            - secretRef:
                name: luna-env-secrets

