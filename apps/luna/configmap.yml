apiVersion: v1
kind: ConfigMap
metadata:
  name: luna-config
  namespace: galaxy
data:
  # SvelteKit origin configuration
  ORIGIN: "https://luna.pinwheel.fan"
  HOST_HEADER: "x-forwarded-host"
  PROTOCOL_HEADER: "x-forwarded-proto"
  
  # Backend API host
  LUNA_AUGUR_HOST: "http://augur-service.galaxy.svc.cluster.local:8000"

  # Protomaps vector basemap key. Public by design (sent to the browser);
  # CORS origins for it are restricted at protomaps.com/account
  PUBLIC_PROTOMAPS_KEY: "487eb631c5cfc854"
