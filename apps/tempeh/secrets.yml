# Synced into k8s by the mirage pipeline (cuneiform-policies/sync.sh).
#
# tempeh (rodeyfeld/tempeh) is OpenTofu, not a deployment: its pipeline keeps the
# colonies' Hetzner resources and records, with its state in the tempeh database on
# atlas. That pipeline reads this path itself with its own Bao token (policy `tempeh`):
# `db_password` for the state, plus `colonies_hcloud_token` and `pinwheel_hcloud_token`,
# which are written by hand (patch-key.sh) and never leave cuneiform for a Secret.
#
# `db_password` is generated; job.yml (tempeh-db-ensure) makes the role and database on
# atlas and keeps the role's password equal to it, reading it as TEMPEH_DB_PASSWORD.
path: galaxy-kv/prod/tempeh
secret: tempeh-env-secrets
generate:
  db_password: alnum-32
env:
  # The password alone, for job.yml to set on the role.
  TEMPEH_DB_PASSWORD: "{db_password}"
