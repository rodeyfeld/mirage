# tempeh's state database on atlas (its OpenTofu `pg` backend), made or mended from the
# generated secret: creates the role if it's missing, sets its password to the current
# `db_password` either way, and creates the database if it's missing. The same Job as
# pothos-db-ensure.
#
# Applied by the pipeline (apps/*/job.yml). A Job's template is immutable, so a re-run after
# the first needs the old one gone first:
#   k3s kubectl -n galaxy delete job tempeh-db-ensure
# then a push or a manual pipeline run.
apiVersion: batch/v1
kind: Job
metadata:
  name: tempeh-db-ensure
  namespace: galaxy
spec:
  template:
    spec:
      containers:
        - name: psql
          # atlas's own image: the same psql as the server.
          image: schematics.pinwheel.fan/rodeyfeld/atlas@sha256:368c8f6546d4b01d306431467659d50decd57ade882661088b6d59fbe72f0695
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -eu
              export PGPASSWORD="$POSTGRES_PASSWORD"
              psql -v ON_ERROR_STOP=1 -h atlas-service.galaxy.svc.cluster.local -U postgres -d postgres \
                -v pw="$TEMPEH_DB_PASSWORD" <<'SQL'
              SELECT format('CREATE ROLE tempeh LOGIN PASSWORD %L', :'pw')
                WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'tempeh') \gexec
              ALTER ROLE tempeh WITH LOGIN PASSWORD :'pw';
              SELECT 'CREATE DATABASE tempeh OWNER tempeh'
                WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = 'tempeh') \gexec
              SQL
              echo "tempeh role and database are as the secret says"
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: atlas-env-secrets
                  key: POSTGRES_PASSWORD
            - name: TEMPEH_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tempeh-env-secrets
                  key: TEMPEH_DB_PASSWORD
      restartPolicy: OnFailure
  backoffLimit: 3
