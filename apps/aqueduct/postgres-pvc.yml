apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aqueduct-postgres-pvc
  namespace: haar
  labels:
    name: aqueduct-postgres-pvc
spec:
  storageClassName: manual
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  selector:
    matchLabels:
      name: aqueduct-postgres-volume
