# Synced into k8s by the mirage pipeline (cuneiform-policies/sync.sh).
#
# The model key is the one secret that exists only in this namespace. It
# isn't generated: write it once by hand (`bao kv patch galaxy-kv/prod/aqueduct
# anthropic_api_key=-`, value on stdin), then add the line below and push.
# Until then aqueduct runs with no provider: every call is refused and the
# directors fall back to their defaults.
#
#   ANTHROPIC_API_KEY: "{anthropic_api_key}"
#
# cistern reads `cistern_token` from here through its own secrets spec.
namespace: haar
path: galaxy-kv/prod/aqueduct
secret: aqueduct-env-secrets
generate:
  admin_token: alnum-40
  cistern_token: alnum-40
  postgres_password: alnum-32
env:
  AQUEDUCT_ADMIN_TOKEN: "{admin_token}"
  AQUEDUCT_CISTERN_TOKEN: "{cistern_token}"
  POSTGRES_PASSWORD: "{postgres_password}"
  DATABASE_URL: "ecto://aqueduct:{postgres_password}@aqueduct-postgres:5432/aqueduct_prod"
