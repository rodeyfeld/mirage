apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cuneiform
  namespace: galaxy
spec:
  serviceName: cuneiform-service
  replicas: 1
  selector:
    matchLabels:
      name: cuneiform
  template:
    metadata:
      labels:
        name: cuneiform
    spec:
      serviceAccountName: cuneiform
      containers:
        - name: cuneiform
          # Pinned: the version that wrote the raft data (2025-11). From 2.5/2.6 on the
          # image runs as the non-root openbao user and can't open the root-owned
          # /openbao/data, so moving past 2.4 needs a chown (the owner's call).
          image: openbao/openbao:2.4.4
          imagePullPolicy: Always
          command: ["bao"]
          args: ["server", "-config", "/openbao/config/config.hcl"]
          ports:
            - containerPort: 8200
            - containerPort: 8201
          volumeMounts:
            - name: config
              mountPath: /openbao/config
            - name: data
              mountPath: /openbao/data
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pidof bao
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204
              port: 8200
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            capabilities:
              add:
                - IPC_LOCK
      volumes:
        - name: config
          configMap:
            name: cuneiform-config
        - name: data
          persistentVolumeClaim:
            claimName: cuneiform-pvc

