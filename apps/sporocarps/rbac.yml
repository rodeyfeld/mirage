# mycelia (ServiceAccount galaxy/mycelia) runs sporocarp pods and reads their
# logs, in this namespace only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mycelia-sporocarps
  namespace: sporocarps
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, create, delete]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mycelia-sporocarps
  namespace: sporocarps
subjects:
  - kind: ServiceAccount
    name: mycelia
    namespace: galaxy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mycelia-sporocarps
