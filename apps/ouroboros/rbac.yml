apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ouroboros-deployer-role
rules:
  # Allow managing all resources in galaxy namespace (for deployment restarts)
  - apiGroups: ["", "apps", "batch", "extensions"]
    resources:
      [
        "deployments",
        "statefulsets",
        "pods",
        "pods/log",
        "services",
        "configmaps",
        "secrets",
        "jobs",
        "persistentvolumeclaims",
      ]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Allow Woodpecker to spawn agent pods in woodpecker namespace (if using k8s backend)
  # or in the agent's own namespace
  - apiGroups: [""]
    resources: ["pods", "pods/log", "persistentvolumeclaims"]
    verbs: ["create", "delete", "get", "list", "watch", "update", "patch"]

# Bound only in the namespaces CI writes to (galaxy, haar, lab), not cluster-wide:
# no Secrets in spores, sporocarps, kube-system or cert-manager. `default` is here
# because the projects' own deploy steps run as it (`kubectl rollout restart`).
# Applied by hand. Replacing the old cluster-wide binding:
#   kubectl apply -f apps/ouroboros/rbac.yml
#   kubectl delete clusterrolebinding ouroboros-deployer-binding
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ouroboros-deployer
  namespace: galaxy
subjects:
  - kind: ServiceAccount
    name: ouroboros-deployer
    namespace: galaxy
  - kind: ServiceAccount
    name: default
    namespace: galaxy
roleRef:
  kind: ClusterRole
  name: ouroboros-deployer-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ouroboros-deployer
  namespace: haar
subjects:
  - kind: ServiceAccount
    name: ouroboros-deployer
    namespace: galaxy
  - kind: ServiceAccount
    name: default
    namespace: galaxy
roleRef:
  kind: ClusterRole
  name: ouroboros-deployer-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ouroboros-deployer
  namespace: lab
subjects:
  - kind: ServiceAccount
    name: ouroboros-deployer
    namespace: galaxy
  - kind: ServiceAccount
    name: default
    namespace: galaxy
roleRef:
  kind: ClusterRole
  name: ouroboros-deployer-role
  apiGroup: rbac.authorization.k8s.io
