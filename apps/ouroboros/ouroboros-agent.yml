apiVersion: apps/v1
kind: Deployment
metadata:
  name: ouroboros-agent
  namespace: galaxy
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      name: ouroboros-agent
  template:
    metadata:
      labels:
        name: ouroboros-agent
    spec:
      serviceAccountName: ouroboros-deployer
      containers:
        - name: agent
          image: woodpeckerci/woodpecker-agent:v3.13.0
          envFrom:
            - configMapRef:
                name: ouroboros-config
            - secretRef:
                name: ouroboros-env-secrets
          env:
            - name: WOODPECKER_SERVER
              value: "ouroboros-service:9000"
            - name: WOODPECKER_MAX_PROCS
              value: "2"
          ports:
            - containerPort: 3000
          # The agent's built-in health server (WOODPECKER_HEALTHCHECK_ADDR, default :3000)
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 15
