# Synced into k8s by the mirage pipeline (cuneiform-policies/sync.sh).
path: galaxy-kv/prod/ouroboros
secret: ouroboros-env-secrets
env:
  WOODPECKER_HOST: "https://ouroboros.pinwheel.fan"
  WOODPECKER_AGENT_SECRET: "{agent_secret}"
  # OAuth app "ouroboros" on schematics (Forgejo), owned by rodeyfeld
  WOODPECKER_FORGEJO_CLIENT: "05d7e6a9-0a89-469b-8905-01b527b54b1f"
  WOODPECKER_FORGEJO_SECRET: "{forgejo_secret}"
  WOODPECKER_DATABASE_DRIVER: "sqlite3"
  # Fresh DB for the Forgejo forge. woodpecker.sqlite next to it is the old
  # GitHub-era DB, kept for rollback and history.
  WOODPECKER_DATABASE_DATASOURCE: "/var/lib/woodpecker/woodpecker-forgejo.sqlite"
  WOODPECKER_ADMIN: "rodeyfeld"
