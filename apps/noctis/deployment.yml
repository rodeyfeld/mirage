apiVersion: apps/v1
kind: Deployment
metadata:
  name: noctis
  namespace: galaxy
spec:
  replicas: 1
  selector:
    matchLabels:
      name: noctis
  template:
    metadata:
      labels:
        name: noctis
    spec:
      serviceAccountName: noctis
      containers:
        - name: noctis
          image: schematics.pinwheel.fan/rodeyfeld/noctis
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: noctis-config
            - secretRef:
                name: noctis-env-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            # Room for a study's 50,000-match cap held in memory
            limits:
              memory: "1Gi"
              cpu: "500m"
          # Prefect's runner webserver (PREFECT_RUNNER_SERVER_* in the configmap): /health
          # fails when the runner stops polling for scheduled runs
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 15
