# Synced into k8s by the mirage pipeline (cuneiform-policies/sync.sh).
# `{atlas.postgres_password}` reads another app's path (galaxy-kv/prod/atlas), and
# `{ephemeris.postgres_password}` galaxy-kv/prod/ephemeris.
path: galaxy-kv/prod/noctis
secret: noctis-env-secrets
env:
  PREFECT_DB_PASSWORD: "{prefect_db_password}"
  PREFECT_API_DATABASE_CONNECTION_URL: "postgresql+asyncpg://prefect:{prefect_db_password}@noctis-postgres-service:5432/prefect"
  PREFECT_SERVER_API_AUTH_STRING: "{prefect_auth_string}"
  PREFECT_API_AUTH_STRING: "{prefect_auth_string}"
  ATLAS_DB_PASSWORD: "{atlas.postgres_password}"
  EPHEMERIS_DB_PASSWORD: "{ephemeris.postgres_password}"
