apiVersion: v1
kind: ConfigMap
metadata:
  name: mycelia-config
  namespace: galaxy
data:
  PHX_SERVER: "true"
  PHX_HOST: "mycelia.pinwheel.fan"
  PORT: "4000"
  POOL_SIZE: "5"
  MYCELIA_BASIC_AUTH_USER: "rodeyfeld"
  # The mycologist's LLM assessor, on the Claude API (ANTHROPIC_API_KEY).
  MYCELIA_ASSESSOR: "on"
  # The orrery's collector (/map/orrery): kami's deploys API (Woodpecker
  # pipelines + rollouts) and noctis's Prefect API, both in-cluster.
  MYCELIA_ORRERY_KAMI_URL: "http://kami-service.galaxy.svc.cluster.local:8888"
  MYCELIA_ORRERY_PREFECT_URL: "http://noctis-prefect-service.galaxy.svc.cluster.local:4200/api"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mycelia-postgres-config
  namespace: galaxy
data:
  POSTGRES_USER: "mycelia"
  POSTGRES_DB: "mycelia_prod"
  PGDATA: "/var/lib/postgresql/data/pgdata"
