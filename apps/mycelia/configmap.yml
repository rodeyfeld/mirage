apiVersion: v1
kind: ConfigMap
metadata:
  name: mycelia-config
  namespace: galaxy
data:
  PHX_SERVER: "true"
  PHX_HOST: "mycelia.pinwheel.fan"
  PORT: "4000"
  POOL_SIZE: "5"
  MYCELIA_BASIC_AUTH_USER: "rodeyfeld"
  # The pods find each other here and cluster (mycelia-headless, service.yml).
  DNS_CLUSTER_QUERY: "mycelia-headless.galaxy.svc.cluster.local"
  # The mycologist's LLM assessor: Claude Haiku through Claude Code, on the
  # Claude subscription in CLAUDE_CODE_OAUTH_TOKEN.
  MYCELIA_ASSESSOR: "on"
  # Spores (/spores): a pod per spore in the `spores` namespace (apps/spores),
  # running Claude Code on the same subscription.
  MYCELIA_SPORES_HOST: "kube"
  MYCELIA_SPORES_NAMESPACE: "spores"
  MYCELIA_SPORES_IMAGE: "schematics.pinwheel.fan/rodeyfeld/spore:latest"
  # Each spore pod's tokens in a Secret of its own, not its spec. Needs the
  # secrets rule in apps/spores/rbac.yml applied first (RBAC is applied by hand).
  MYCELIA_SPORES_SECRETS: "on"
  # Spores commit to the universe repos as rodeyfeld; the push token is
  # spores_git_token in cuneiform (MYCELIA_SPORES_GIT_TOKEN).
  MYCELIA_SPORES_GIT_EMAIL: "eric.d.rodefeld@gmail.com"
  # The mycologist's own spore: always up, with cluster access (apps/spores/
  # mycologist.yml), summoned to failed deploys, conflicting agents and spores
  # that ask for help.
  MYCELIA_MYCOLOGIST_SPORE: "on"
  # The rhizomorph's collector (/map/rhizomorph): kami's deploys API (Woodpecker
  # pipelines + rollouts) and noctis's Prefect API, both in-cluster.
  MYCELIA_RHIZOMORPH_KAMI_URL: "http://kami-service.galaxy.svc.cluster.local:8888"
  MYCELIA_RHIZOMORPH_PREFECT_URL: "http://noctis-prefect-service.galaxy.svc.cluster.local:4200/api"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mycelia-postgres-config
  namespace: galaxy
data:
  POSTGRES_USER: "mycelia"
  POSTGRES_DB: "mycelia_prod"
  PGDATA: "/var/lib/postgresql/data/pgdata"
