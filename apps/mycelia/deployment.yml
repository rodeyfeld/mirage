apiVersion: apps/v1
kind: Deployment
metadata:
  name: mycelia
  namespace: galaxy
spec:
  replicas: 1
  # Roll: the new pod joins the old one's cluster (POD_IP, mycelia-headless)
  # and takes traffic once it's ready; only then does the old one stop, handing
  # its spores over. Each spore's tree still runs on one pod at a time
  # (Mycelia.Cluster in mycelia), so the two never race over a spore.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      name: mycelia
  template:
    metadata:
      labels:
        name: mycelia
    spec:
      serviceAccountName: mycelia
      containers:
        - name: mycelia
          image: schematics.pinwheel.fan/rodeyfeld/mycelia
          imagePullPolicy: Always
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              # The mycologist runs `claude -p` (Claude Code) beside the app.
              memory: 1536Mi
          ports:
            - containerPort: 4000
          env:
            # Names the node mycelia@<pod IP>, so the pods can cluster.
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          envFrom:
            - configMapRef:
                name: mycelia-config
            - secretRef:
                name: mycelia-env-secrets
          # /health is the only route outside force_ssl and both auth gates (basic
          # auth on pages, the ingest token on /api); /assets bundles are public.
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 10
          # Probe every second, so a rollout moves on as soon as the new pod is up.
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            periodSeconds: 1
