apiVersion: apps/v1
kind: Deployment
metadata:
  name: mycelia
  namespace: galaxy
spec:
  replicas: 1
  selector:
    matchLabels:
      name: mycelia
  template:
    metadata:
      labels:
        name: mycelia
    spec:
      serviceAccountName: mycelia
      containers:
        - name: mycelia
          image: schematics.pinwheel.fan/rodeyfeld/mycelia
          imagePullPolicy: Always
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi
          ports:
            - containerPort: 4000
          envFrom:
            - configMapRef:
                name: mycelia-config
            - secretRef:
                name: mycelia-env-secrets
          # /health is the only route outside force_ssl and both auth gates (basic
          # auth on pages, the ingest token on /api); /assets bundles are public.
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 5
