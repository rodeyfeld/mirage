apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mycelia-ingress
  namespace: galaxy
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: galaxy-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: mycelia.pinwheel.fan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mycelia-service
                port:
                  number: 80
  tls:
    - secretName: mycelia-tls
      hosts:
        - mycelia.pinwheel.fan
