# Synced into k8s by the mirage pipeline (cuneiform-policies/sync.sh).
# Every value is generated on first sync; read the basic-auth password and the
# hook's ingest token back with `bao kv get galaxy-kv/prod/mycelia`.
# `claude_code_oauth_token` is not generated: it's a Claude subscription token
# from `claude setup-token`, put in by hand
# (`bao kv patch galaxy-kv/prod/mycelia claude_code_oauth_token=-`, value on
# stdin). It must be there before this syncs: a missing value fails the sync.
path: galaxy-kv/prod/mycelia
secret: mycelia-env-secrets
generate:
  secret_key_base: base64-48
  postgres_password: alnum-32
  ingest_token: alnum-32
  basic_auth_password: alnum-24
  # The Erlang cookie the mycelia pods cluster with (one for every build).
  release_cookie: alnum-48
env:
  SECRET_KEY_BASE: "{secret_key_base}"
  POSTGRES_PASSWORD: "{postgres_password}"
  DATABASE_URL: "ecto://mycelia:{postgres_password}@mycelia-postgres:5432/mycelia_prod"
  MYCELIA_INGEST_TOKEN: "{ingest_token}"
  MYCELIA_BASIC_AUTH_PASSWORD: "{basic_auth_password}"
  RELEASE_COOKIE: "{release_cookie}"
  # The mycologist's verdicts and the spores' Claude Code sessions run on it.
  CLAUDE_CODE_OAUTH_TOKEN: "{claude_code_oauth_token}"
  # Spores clone and push the universe repos with it: a rodeyfeld Forgejo token
  # with write:repository (`spores` on schematics), put in by hand with
  # patch-key.sh. It must be there before this syncs.
  MYCELIA_SPORES_GIT_TOKEN: "{spores_git_token}"
  # Prefect's basic-auth string, read from noctis's path, so the orrery can
  # list flow runs.
  MYCELIA_ORRERY_PREFECT_AUTH: "{noctis.prefect_auth_string}"
  # The mycologist's spore reads Woodpecker pipelines and logs with it: kami's
  # token, which is read-only. To let it rerun pipelines too, put a rodeyfeld
  # ouroboros token in this path as `mycologist_woodpecker_token` (patch-key.sh)
  # and point this at "{mycologist_woodpecker_token}".
  MYCELIA_MYCOLOGIST_WOODPECKER_TOKEN: "{kami.woodpecker_token}"
