# The mycologist's spore (mycelia's own, always on; Mycelia.Mycologist.Summons)
# runs as this service account, with its token mounted. It reads the whole
# cluster (not secrets). In the app namespaces (galaxy, haar, sporocarps) it's an
# operator: the built-in `edit` role plus traefik and cert-manager resources, so
# it can apply what mirage's CI doesn't (ingresses, network policies, service
# accounts) and fix things by hand. It can't change RBAC, quotas, namespaces or
# nodes, and has no write access in kube-system, cert-manager or its own spores
# namespace (it can't loosen its own sandbox), save the spores quota (below).
# Applied by hand:
#   kubectl apply -f apps/spores/
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mycologist
  namespace: spores
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mycologist-read
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - events
      - services
      - endpoints
      - configmaps
      - persistentvolumeclaims
      - persistentvolumes
      - namespaces
      - nodes
      - resourcequotas
      - serviceaccounts
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets, replicasets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [get, list, watch]
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [pods, nodes]
    verbs: [get, list]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings, clusterroles, clusterrolebindings]
    verbs: [get, list, watch]
  - apiGroups: [traefik.io, cert-manager.io]
    resources: ["*"]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mycologist-read
subjects:
  - kind: ServiceAccount
    name: mycologist
    namespace: spores
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mycologist-read
---
# What `edit` leaves out in the app namespaces: traefik's routes and middlewares
# and cert-manager's certificates and issuers.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mycologist-ingress-extras
rules:
  - apiGroups: [traefik.io, cert-manager.io]
    resources: ["*"]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mycologist-edit
  namespace: galaxy
subjects:
  - kind: ServiceAccount
    name: mycologist
    namespace: spores
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mycologist-ingress-extras
  namespace: galaxy
subjects:
  - kind: ServiceAccount
    name: mycologist
    namespace: spores
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mycologist-ingress-extras
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mycologist-edit
  namespace: haar
subjects:
  - kind: ServiceAccount
    name: mycologist
    namespace: spores
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mycologist-ingress-extras
  namespace: haar
subjects:
  - kind: ServiceAccount
    name: mycologist
    namespace: spores
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mycologist-ingress-extras
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mycologist-edit
  namespace: sporocarps
subjects:
  - kind: ServiceAccount
    name: mycologist
    namespace: spores
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mycologist-ingress-extras
  namespace: sporocarps
subjects:
  - kind: ServiceAccount
    name: mycologist
    namespace: spores
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mycologist-ingress-extras
---
# The one exception to "it can't loosen its own sandbox": the owner lets it set
# how many spores run at once (apps/spores/namespace.yml's quota), so capacity
# changes don't wait on the owner's kubeconfig. Only that one quota, by name, and
# only get/patch/update: no create or delete, not the namespace, nothing else in
# spores.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mycologist-quota
  namespace: spores
rules:
  - apiGroups: [""]
    resources: ["resourcequotas"]
    resourceNames: ["spores"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mycologist-quota
  namespace: spores
subjects:
  - kind: ServiceAccount
    name: mycologist
    namespace: spores
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mycologist-quota
