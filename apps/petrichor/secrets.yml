# Synced into k8s by the mirage pipeline (cuneiform-policies/sync.sh).
#
# `forge_token` is a Forgejo token with read access to the petrichor-worlds
# org, for cloning world repos at boot. It isn't generated: write it once by
# hand (`bao kv patch galaxy-kv/prod/petrichor forge_token=-`, value on
# stdin), then add the line below and push. Until then the server runs with
# the river's own world only.
#
#   SLUICE_FORGE_TOKEN: "{forge_token}"
#
# `db_password` is generated; the role and database on atlas are made, and
# the role's password kept equal to it, by job.yml (petrichor-db-ensure),
# which reads it as PETRICHOR_DB_PASSWORD. cistern migrates at start
# (rel/overlays/bin/server) and isn't ready until the database exists.
path: galaxy-kv/prod/petrichor
secret: petrichor-env-secrets
generate:
  secret_key_base: base64-48
  # Basic auth in front of the whole site while the game is in development.
  # Read it back with `bao kv get -field=gate_password galaxy-kv/prod/petrichor`
  # (the user is CISTERN_GATE_USER in the configmap).
  gate_password: alnum-24
  db_password: alnum-32
env:
  SECRET_KEY_BASE: "{secret_key_base}"
  CISTERN_GATE_PASSWORD: "{gate_password}"
  # cistern's token for aqueduct, generated under aqueduct's path.
  AQUEDUCT_TOKEN: "{aqueduct.cistern_token}"
  # The petrichor database on atlas: worlds, adventures, ledgers.
  DATABASE_URL: "ecto://petrichor:{db_password}@atlas-service.galaxy.svc.cluster.local:5432/petrichor"
  # The same password alone, for job.yml to set on the role.
  PETRICHOR_DB_PASSWORD: "{db_password}"
