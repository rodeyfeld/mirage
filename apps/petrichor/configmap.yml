apiVersion: v1
kind: ConfigMap
metadata:
  name: petrichor-config
  namespace: galaxy
data:
  PHX_SERVER: "true"
  PHX_HOST: "petrichor.pinwheel.fan"
  PORT: "4000"
  # Worlds to clone from schematics and open at boot, besides the river's own.
  # Needs SLUICE_FORGE_TOKEN (see secrets.yml); without it only Hollin is open.
  CISTERN_WORLDS: "moss_hollow=https://schematics.pinwheel.fan/petrichor-worlds/moss_hollow.git"
  CISTERN_FORGE_USER: "rodeyfeld"
  # Basic auth user; the password is generated into the Secret.
  CISTERN_GATE_USER: "dowser"
  # A second login the gate accepts, for testing by hand: a standard user with
  # an easy password, plain here on purpose. The game has no real data yet.
  CISTERN_TESTER_USER: "tester"
  CISTERN_TESTER_PASSWORD: "wetstone"
  # The agent proxy, in its own namespace. Its token comes from the Secret.
  AQUEDUCT_URL: "http://aqueduct-service.haar.svc.cluster.local"
  # A world with no adventure for this long goes dormant: its director
  # stops and its Haar spends nothing until someone sets out there again.
  CISTERN_DORMANT_AFTER_HOURS: "168"
