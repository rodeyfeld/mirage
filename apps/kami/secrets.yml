# Synced into k8s by the mirage pipeline (cuneiform-policies/sync.sh).
# `woodpecker_token` is not generated: it's the ouroboros token of the read-only
# Forgejo user `kami` (log in to ouroboros as kami, copy its token), put in by
# hand with `bao kv patch galaxy-kv/prod/kami woodpecker_token=-`.
path: galaxy-kv/prod/kami
secret: kami-env-secrets
env:
  KAMI_WOODPECKER_TOKEN: "{woodpecker_token}"
