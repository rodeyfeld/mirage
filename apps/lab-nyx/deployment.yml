# An experiment in the lab (`lab new`). Everything here stays in the `lab` namespace:
# mirage's CI rejects anything under apps/lab-*/ that doesn't.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nyx
  namespace: lab
spec:
  replicas: 1
  selector:
    matchLabels:
      name: nyx
  template:
    metadata:
      labels:
        name: nyx
        lab: experiment
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: nyx
          image: schematics.pinwheel.fan/lab/nyx
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          livenessProbe:
            httpGet: { path: /livez, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: 8080 }
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 128Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
