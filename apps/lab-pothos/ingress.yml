# Applied by the lab mycologist (mirage's CI applies no ingresses).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pothos-ingress
  namespace: lab
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: lab-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: pothos.lab.pinwheel.fan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pothos-service
                port:
                  number: 80
  tls:
    - secretName: pothos-lab-tls
      hosts:
        - pothos.lab.pinwheel.fan
