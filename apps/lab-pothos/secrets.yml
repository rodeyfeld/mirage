# Synced by the mirage pipeline into the lab namespace. A new secret_key_base (players
# sign in again after the move) and a new password on lab-postgres; the data comes
# over by pg_dump (README in apps/lab/).
path: galaxy-kv/prod/lab-pothos
secret: lab-pothos-env-secrets
namespace: lab
generate:
  secret_key_base: base64-48
  db_password: alnum-32
env:
  SECRET_KEY_BASE: "{secret_key_base}"
  DATABASE_URL: "ecto://pothos:{db_password}@lab-postgres-service.lab.svc.cluster.local:5432/pothos"
  DB_PASSWORD: "{db_password}"
