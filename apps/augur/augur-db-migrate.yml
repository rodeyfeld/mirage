apiVersion: batch/v1
kind: Job
metadata:
  name: augur-db-migrate
  namespace: galaxy
spec:
  template:
    spec:
      containers:
        - name: augur-db-migrate
          image: schematics.pinwheel.fan/rodeyfeld/augur
          imagePullPolicy: Always
          # augur's own tables in atlas, then the archive table in ephemeris
          command:
            - sh
            - -c
            - python manage.py migrate --noinput && python manage.py migrate --database=archive --noinput
          envFrom:
            - configMapRef:
                name: augur-config
            - secretRef:
                name: augur-env-secrets
      restartPolicy: OnFailure
  backoffLimit: 1
