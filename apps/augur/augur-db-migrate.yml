apiVersion: batch/v1
kind: Job
metadata:
  name: augur-db-migrate
  namespace: galaxy
spec:
  template:
    spec:
      containers:
        - name: augur-db-migrate
          image: schematics.pinwheel.fan/rodeyfeld/augur
          imagePullPolicy: Always
          command: ["python", "manage.py", "migrate", "--noinput"]
          envFrom:
            - configMapRef:
                name: augur-config
            - secretRef:
                name: augur-env-secrets
      restartPolicy: OnFailure
  backoffLimit: 1
