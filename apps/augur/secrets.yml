# Synced into k8s by the mirage pipeline (cuneiform-policies/sync.sh).
path: galaxy-kv/prod/augur
secret: augur-env-secrets
env:
  AUGUR_SECRET_KEY: "{secret_key}"
  AUGUR_DB_PASSWORD: "{db_password}"
  AUGUR_ARCHIVE_DB_PASSWORD: "{ephemeris.postgres_password}"
  NOCTIS_USER: "{noctis_user}"
  NOCTIS_PASSWORD: "{noctis_password}"
