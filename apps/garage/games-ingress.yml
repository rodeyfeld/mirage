# games.pinwheel.fan: the games colonies publish (mycelia's
# Mycelia.Colonies.Publish), served by garage's website endpoint from the bucket
# of that name (garage picks the bucket by the Host header). Its DNS record is
# tempeh's (sites.tf). The bucket, website access and mycelia's key for it are
# made by hand: see apps/mycelia/secrets.yml (publish_*).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: games-ingress
  namespace: galaxy
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: galaxy-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: games.pinwheel.fan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: garage
                port:
                  number: 3902
  tls:
    - secretName: games-tls
      hosts:
        - games.pinwheel.fan
