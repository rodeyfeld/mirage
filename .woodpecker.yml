steps:
  # Make cuneiform + the galaxy Secrets match the repo: policies/roles from
  # cuneiform-policies/*-policy.hcl, secrets from apps/*/secrets.yml (missing
  # `generate:` keys are created once). See cuneiform-policies/README.md.
  sync-secrets:
    image: bitnami/kubectl
    environment:
      # Use internal cluster address (faster + no TLS issues)
      BAO_ADDR: http://cuneiform-service.galaxy.svc.cluster.local:8200
      BAO_TOKEN:
        from_secret: cuneiform_token
    commands:
      - curl -fsSL -o /tmp/yq https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64 && chmod +x /tmp/yq
      - PATH="/tmp:$PATH" cuneiform-policies/sync.sh apply
    when:
      - event: [push, manual]
        branch: main

  apply-all:
    image: bitnami/kubectl
    commands:
      - echo "Applying app manifests (namespace-scoped only)..."
      # Apply only namespace-scoped resources that CI has permission for
      # Cluster-scoped resources (RBAC, PV, Ingress, ServiceAccounts) managed manually
      - |
        for file in apps/*/deployment.yml apps/*/*-postgres.yml apps/*/service.yml apps/*/configmap.yml \
                    apps/*/statefulset.yml apps/*/*pvc.yml apps/*/job.yml; do
          [ -f "$file" ] && kubectl apply -f "$file" -n galaxy
        done
      - echo "App manifests applied :)"
    when:
      - event: [push, manual]
        branch: main

  restart-deployments:
    image: bitnami/kubectl
    commands:
      - echo "Restarting all resources (excluding cuneiform)..."
      # StatefulSets with RWO PVCs: restart sequentially so only one rolling
      # operation touches a given SS at a time. Do NOT block the pipeline on
      # rollout status — if a pod is CrashLoopBackOff, `rollout status` would
      # wait until --timeout every run and look "stuck"; CI only needs to
      # trigger restarts, not prove every workload is healthy.
      - |
        set +e
        for ss in $(kubectl get statefulset -n galaxy -o name 2>/dev/null | grep -v cuneiform); do
          echo "Restarting $ss..."
          kubectl rollout restart -n galaxy "$ss"
        done
      - |
        # Exclude ouroboros — restarting the agent kills the running pipeline step
        kubectl get deployment -n galaxy -o name | grep -v ouroboros | xargs -r kubectl rollout restart -n galaxy
      - echo "All restart requests sent"
    when:
      - event: [push, manual]
        branch: main
