steps:
  # Make cuneiform + the galaxy Secrets match the repo: policies/roles from
  # cuneiform-policies/*-policy.hcl, secrets from apps/*/secrets.yml (missing
  # `generate:` keys are created once). See cuneiform-policies/README.md.
  sync-secrets:
    image: bitnami/kubectl
    environment:
      # Use internal cluster address (faster + no TLS issues)
      BAO_ADDR: http://cuneiform-service.galaxy.svc.cluster.local:8200
      BAO_TOKEN:
        from_secret: cuneiform_token
      # Apps whose Secret changed, for restart-changed below
      CHANGED_SECRETS_FILE: .changed-secrets
    commands:
      - curl -fsSL -o /tmp/yq https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64 && chmod +x /tmp/yq
      - PATH="/tmp:$PATH" cuneiform-policies/sync.sh apply
    when:
      - event: [push, manual]
        branch: main

  apply-all:
    image: bitnami/kubectl
    commands:
      - echo "Applying app manifests (namespace-scoped only)..."
      # Apply only namespace-scoped resources that CI has permission for
      # Cluster-scoped resources (RBAC, PV, Ingress, ServiceAccounts) managed manually
      - |
        for file in apps/*/deployment.yml apps/*/*-postgres.yml apps/*/service.yml apps/*/configmap.yml \
                    apps/*/statefulset.yml apps/*/*pvc.yml apps/*/job.yml; do
          [ -f "$file" ] && kubectl apply -f "$file" -n galaxy
        done
      - echo "App manifests applied :)"
    when:
      - event: [push, manual]
        branch: main

  restart-changed:
    image: bitnami/kubectl
    environment:
      CHANGED_SECRETS_FILE: .changed-secrets
    commands:
      # Only the apps this push touched (files under apps/<app>/ or a changed Secret);
      # a manual run restarts everything. See the script for what's never restarted.
      - ci/restart-changed.sh
    when:
      - event: [push, manual]
        branch: main
