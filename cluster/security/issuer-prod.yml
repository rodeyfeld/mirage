apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
  namespace: galaxy
spec:
  acme:
    email: eric.d.rodefeld@gmail.com
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
    - http01:
        ingress:
          class: traefik
          # ClusterIP, not the default NodePort: Traefik routes to it, and namespaces like
          # lab forbid NodePort services in their quota.
          serviceType: ClusterIP
