# Forgejo reads FORGEJO__<section>__<KEY> env vars into app.ini on start.
apiVersion: v1
kind: ConfigMap
metadata:
  name: schematics-config
  namespace: schematics
data:
  FORGEJO__DEFAULT__APP_NAME: "schematics"
  FORGEJO__server__DOMAIN: "schematics.pinwheel.fan"
  FORGEJO__server__ROOT_URL: "https://schematics.pinwheel.fan/"
  FORGEJO__server__HTTP_PORT: "3000"
  FORGEJO__server__SSH_DOMAIN: "schematics.pinwheel.fan"
  FORGEJO__server__SSH_PORT: "22"
  FORGEJO__server__SSH_LISTEN_PORT: "2222"
  FORGEJO__server__START_SSH_SERVER: "true"
  FORGEJO__server__LFS_START_SERVER: "true"
  FORGEJO__database__DB_TYPE: "postgres"
  FORGEJO__database__HOST: "schematics-postgres:5432"
  FORGEJO__database__NAME: "schematics"
  FORGEJO__database__USER: "schematics"
  FORGEJO__security__INSTALL_LOCK: "true"
  FORGEJO__service__DISABLE_REGISTRATION: "true"
  FORGEJO__service__REQUIRE_SIGNIN_VIEW: "true"
  FORGEJO__repository__DEFAULT_PRIVATE: "private"
  FORGEJO__packages__ENABLED: "true"
  # CI stays on ouroboros (Woodpecker)
  FORGEJO__actions__ENABLED: "false"
  FORGEJO__session__COOKIE_SECURE: "true"
  FORGEJO__log__LEVEL: "Info"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: schematics-postgres-config
  namespace: schematics
data:
  POSTGRES_USER: "schematics"
  POSTGRES_DB: "schematics"
  PGDATA: "/var/lib/postgresql/data/pgdata"
