apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: schematics-ingress
  namespace: schematics
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: schematics-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: schematics.pinwheel.fan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: schematics-service
                port:
                  number: 80
  tls:
    - secretName: schematics-tls
      hosts:
        - schematics.pinwheel.fan
