apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: schematics-pvc
  namespace: schematics
spec:
  storageClassName: manual
  volumeName: schematics-volume
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 60Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: schematics-postgres-pvc
  namespace: schematics
spec:
  storageClassName: manual
  volumeName: schematics-postgres-volume
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
