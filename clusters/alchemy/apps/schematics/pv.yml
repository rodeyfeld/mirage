apiVersion: v1
kind: PersistentVolume
metadata:
  name: schematics-volume
  labels:
    name: schematics-volume
    type: local
spec:
  storageClassName: manual
  capacity:
    storage: 60Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    # repos, packages (container images), LFS, attachments; owned by uid 1000
    path: /data/schematics/forgejo
  persistentVolumeReclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: schematics-postgres-volume
  labels:
    name: schematics-postgres-volume
    type: local
spec:
  storageClassName: manual
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: /data/schematics/postgres
  persistentVolumeReclaimPolicy: Retain
