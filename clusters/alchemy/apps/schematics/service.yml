apiVersion: v1
kind: Service
metadata:
  name: schematics-service
  namespace: schematics
spec:
  selector:
    name: schematics
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
---
# k3s ServiceLB binds host port 22 straight to Forgejo's SSH server
# (the host's own sshd lives on 2222).
apiVersion: v1
kind: Service
metadata:
  name: schematics-ssh
  namespace: schematics
spec:
  type: LoadBalancer
  selector:
    name: schematics
  ports:
    - name: ssh
      protocol: TCP
      port: 22
      targetPort: 2222
